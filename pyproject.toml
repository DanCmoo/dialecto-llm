[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dialecto-llm"
version = "0.1.0"
description = "Reproducible evaluation framework for dialect variation in Spanish LLM prompts"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dialectollm = "dialectollm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
